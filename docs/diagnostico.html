<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico de archivos</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:60rem;margin:1rem auto;padding:0 1rem;color:#1d2723}
h1{font-size:1.4rem}table{border-collapse:collapse;width:100%;font-size:.85rem}td,th{border-bottom:1px solid #ddd;padding:.25rem .5rem;text-align:left;word-break:break-all}
.ok{color:#1b6b34}.no{color:#9b2c2c;font-weight:700}.res{font-size:1.1rem;font-weight:600}</style></head>
<body><h1>Diagnóstico: ¿están todos los archivos donde el sitio los busca?</h1>
<p>Esta página no cambia nada: solo comprueba cada ruta. Ábrela desde la dirección de GitHub Pages o desde un servidor local, no con doble clic.</p>
<p class="res" id="res">Revisando…</p><table><thead><tr><th>Tipo</th><th>Ruta</th><th>Estado</th></tr></thead><tbody id="t"></tbody></table>
<script>
(async()=>{
const J=async u=>{try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}};
const E=async u=>{try{const r=await fetch(u,{method:'HEAD'});return r.ok}catch(e){return false}};
const enc=p=>String(p).split('/').map(encodeURIComponent).join('/');
const cfg=await J('data/config.json'); if(!cfg){document.getElementById('res').textContent='No se pudo leer data/config.json';return}
const filas=[],add=(t,r)=>{if(r)filas.push([t,r])};
cfg.capas_raster.forEach(c=>add('Capa de cobertura',c.png||cfg.rutas.capas+c.id+'.png'));
add('Coordenadas de las imágenes',cfg.rutas.limites_png);
cfg.capas_vector.filter(v=>v.publicar).forEach(v=>add('Capa vectorial',cfg.rutas.vectores+v.archivo));
add('Áreas por vereda',cfg.rutas.areas_vereda); add('Sitios sagrados',cfg.rutas.sitios);
cfg.hero.forEach(h=>add('Fondo de portada',h)); Object.values(cfg.bandas).forEach(h=>add('Fondo de sección',h));
(await J('data/cartografia.json')||[]).forEach(m=>{add('Mapa',m.imagen);add('Mapa (miniatura)',m.miniatura)});
(await J('data/normatividad.json')||[]).filter(x=>x.publicar_pdf).forEach(x=>add('Normatividad (PDF)',x.pdf));
(await J('data/galeria.json')||[]).filter(x=>x.publicar!==false).forEach(x=>{add('Fotografía',x.imagen);add('Fotografía (miniatura)',x.miniatura)});
const sit=await J(cfg.rutas.sitios);(sit&&sit.features||[]).forEach(f=>f.properties&&f.properties.imagen&&add('Foto de sitio',f.properties.imagen));
const tb=document.getElementById('t');let mal=0;
for(const [t,r] of filas){const ok=await E(enc(r));if(!ok)mal++;tb.insertAdjacentHTML('beforeend',`<tr><td>${t}</td><td>${r}</td><td class="${ok?'ok':'no'}">${ok?'✓ existe':'✗ FALTA'}</td></tr>`)}
document.getElementById('res').textContent=mal?`${mal} de ${filas.length} archivos no se encuentran.`:`Todo en orden: ${filas.length} archivos encontrados.`;
})();
</script></body></html>
